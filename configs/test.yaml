server:
  port: 8080
  https_port: 8443
  mode: debug
  enable_http: true
  enable_https: true
  ssl_cert_file: /etc/nginx/asecondchance.cn_bundle.crt
  ssl_key_file: /etc/nginx/asecondchance.cn.key
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  version: 0.1.0

database:
  mysql:
    host: localhost
    port: 3306
    database: your_database_name
    username: root
    password: password
    charset: utf8mb4
    parse_time: true
    max_open_conns: 10
    max_idle_conns: 5
    conn_max_lifetime: 300s

redis:
  host: localhost
  port: 6379
  password: ""
  database: 0
  pool_size: 10
  min_idle_conns: 3

logging:
  level: debug
  format: json
  output: stdout

auth:
  jwt_secret: "your-dev-jwt-secret-key"
  jwt_expiry: 24h
  refresh_expiry: 168h # 7 days

cors:
  allow_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
    - "http://127.0.0.1:8080"
    - "http://43.136.39.202:8080"
    - "https://asecondchance.cn"
    - "https://www.asecondchance.cn"
  allow_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
    - HEAD
  allow_headers:
    - Origin
    - Content-Type
    - Authorization
    - Accept
    - X-Requested-With
    - X-Platform
    - X-Version
    - Cache-Control
    - Pragma
  allow_credentials: true

rate_limit:
  enabled: true
  requests_per_minute: 100
  burst: 50

email:
  smtp:
    server: smtp.163.com
    port: "465" # 使用SSL端口
    user: A Second Chance
    password: your-email-auth-password
    from: your-email@163.com
  template:
    vericode: template/vericode.html
  emails:
    pic_email: your-email@163.com # 管理员邮箱，用于接收通知

ai:
  providers:
    - name: hunyuan
      api_key: your-hunyuan-api-key
      model_ids:
        - hunyuan-lite
    - name: gemini
      api_key: your-gemini-api-key
      model_ids:
        - gemini-2.0-flash-lite

# SSL证书监控配置
ssl_monitor:
  domain: asecondchance.cn # 监控的域名
  check_interval: 1h # 测试环境：每小时检查一次
  alert_days: [14, 7, 3] # 提醒天数阈值：14天、7天、3天
